#
# Phase 1 fast-dev settings (March 2013, ~140 MB cutout).
# Use for pipeline smoke tests only:
#   snakemake -call solve_elec_networks --configfile config/inre/config.phase1-fast.yaml

tutorial: true

run:
  name: "inre-de-base"
  disable_progressbar: true
  shared_resources:
    policy: false

scenario:
  clusters: [10]
  opts: [""]

countries: [DE]

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

costs:
  year: 2050
  custom_cost_fn: data/inre/custom_costs_nuclear.csv

electricity:
  co2limit_enable: true
  co2limit: 500.e+6
  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    year: 2024
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar
  powerplants_filter: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"

atlite:
  default_cutout: europe-2013-03-sarah3-era5
  cutouts:
    europe-2013-03-sarah3-era5:
      time: ["2013-03-01", "2013-03-08"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  exclude_carriers: [OCGT, offwind-ac, coal]
  temporal:
    resolution_elec: false

lines:
  dynamic_line_rating:
    activate: true
    max_line_rating: 1.3

solving:
  solver:
    name: highs
    options: highs-default
  check_objective:
    enable: false

inre:
  enabled: true
  dunkelflaute:
    enabled: false
    config: data/inre/dunkelflaute.phase1.yaml
  nuclear:
    extendable_carriers: []
    sites_file: data/inre/custom_powerplants_nuclear_DE.csv
    p_nom_max_per_site: 1500
