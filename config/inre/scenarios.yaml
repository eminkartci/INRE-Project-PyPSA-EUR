# --- Phase 2 legacy scenarios (expandable for v2 comparison) ---

base:
  run:
    name: inre-de-base
  inre:
    enabled: true
    dunkelflaute:
      enabled: false
    nuclear:
      extendable_carriers: []

base-fixedcap:
  run:
    name: inre-de-base-fixedcap
  electricity:
    extendable_carriers:
      Generator: []
      StorageUnit: []
  inre:
    enabled: true
    dunkelflaute:
      enabled: false
    nuclear:
      extendable_carriers: []

dunkelflaute:
  run:
    name: inre-de-dunkelflaute
  electricity:
    extendable_carriers:
      Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, CCGT]
      StorageUnit: [battery]
      Store: []
      Link: []
    transmission_limit: vopt
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: legacy
      config: data/inre/dunkelflaute.yaml
    nuclear:
      extendable_carriers: []

dunkelflaute-fixedcap:
