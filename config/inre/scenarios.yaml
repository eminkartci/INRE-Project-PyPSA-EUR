# INRE scenario overrides (merged into config/inre/config.base.yaml).
# Enable via config/inre/config.scenarios.yaml
#
# Phase 3 (v3): fixed-capacity operational stress test by default (config.base.yaml).
# Legacy expandable scenarios override extendable_carriers for v2 backward comparison.
# Historical severe uses direct CF import (data/inre/dunkelflaute.historical.yaml).
# Per-scenario costs: process_inre_scenario_costs (rules/inre.smk).

# --- Legacy backward comparison (2021 window) ---

legacy-2021-base:
  run:
    name: inre-de-legacy-base
  inre:
    enabled: true
    dunkelflaute:
      enabled: false
    nuclear:
      extendable_carriers: []

legacy-synthetic-df:
  run:
    name: inre-de-legacy-synthetic-df
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: legacy
      config: data/inre/dunkelflaute.yaml
    nuclear:
      extendable_carriers: []

# --- v3 historical severe family (snapshots from dunkelflaute.historical.metadata.yaml) ---

matched-reference:
  run:
    name: inre-de-matched-reference
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
    cutouts:
      europe-2021-sarah3-era5:
        time: ["2021-01-18", "2021-02-15"]
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: matched_reference
      config: data/inre/dunkelflaute.matched-reference.yaml
    nuclear:
      extendable_carriers: []

historical-severe:
  run:
    name: inre-de-historical-severe
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
    cutouts:
      europe-2021-sarah3-era5:
        time: ["2021-01-18", "2021-02-15"]
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: historical
      config: data/inre/dunkelflaute.historical.yaml
    nuclear:
      extendable_carriers: []

historical-severe-gen-nuclear:
  run:
    name: inre-de-historical-severe-nuc
  costs:
    custom_cost_fn: data/inre/custom_costs_nuclear.csv
  pypsa_eur:
    Generator:
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - solar-hsat
    - solar
    - ror
    - nuclear
    - generic-advanced-nuclear
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
    cutouts:
      europe-2021-sarah3-era5:
        time: ["2021-01-18", "2021-02-15"]
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: historical
      config: data/inre/dunkelflaute.historical.yaml
    nuclear:
      extendable_carriers: [generic-advanced-nuclear]
      compare_mode: equal-site
      site_names: [Grohnde, Brokdorf, Isar]
      total_cap_mw: 4500

extreme-stress-sensitivity:
  run:
    name: inre-de-extreme-stress
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
