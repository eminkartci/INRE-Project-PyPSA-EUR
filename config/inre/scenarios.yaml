# INRE scenario overrides (merged into config/inre/config.base.yaml).
# Enable via config/inre/config.scenarios.yaml
#
# Shared policy (config.base.yaml): CO2 50 Mt/y; no new OCGT or H2 build; CCGT+VRE+battery extendable.
# Dunkelflaute: 14-day profile stress (data/inre/dunkelflaute.yaml).
# CAPEX sensitivity: dunkelflaute-smr-capex{70,85,115} scale SMR investment vs baseline (100% = dunkelflaute-smr).
# Per-scenario costs are built by ``process_inre_scenario_costs`` (see rules/inre.smk) because shared
# ``resources/costs_*_processed.csv`` ignores scenario ``costs.custom_cost_fn`` overrides.

base:
  run:
    name: inre-de-base
  inre:
    enabled: true
    dunkelflaute:
      enabled: false
    nuclear:
      extendable_carriers: []

dunkelflaute:
  run:
    name: inre-de-dunkelflaute
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      config: data/inre/dunkelflaute.yaml
    nuclear:
      extendable_carriers: []

dunkelflaute-smr:
  run:
    name: inre-de-df-smr
  costs:
    custom_cost_fn: data/inre/custom_costs_nuclear.csv
  pypsa_eur:
    Generator:
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - solar-hsat
    - solar
    - ror
    - nuclear
    - nuclear-smr
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      config: data/inre/dunkelflaute.yaml
    nuclear:
      extendable_carriers: [nuclear-smr]
      sites_file: data/inre/custom_powerplants_nuclear_DE.csv

dunkelflaute-msr:
  run:
    name: inre-de-df-msr
