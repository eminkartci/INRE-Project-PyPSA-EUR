historical-severe-gen-nuclear-v4:
  run:
    name: inre-de-hist-severe-nuc-v4
  costs:
    custom_cost_fn: data/inre/custom_costs_nuclear.csv
  pypsa_eur:
    Generator:
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - solar-hsat
    - solar
    - ror
    - nuclear
    - generic-advanced-nuclear
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
    cutouts:
      europe-2021-sarah3-era5:
        time: ["2021-01-18", "2021-02-15"]
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: historical
      config: data/inre/dunkelflaute.historical.v4.yaml
    nuclear:
      extendable_carriers: [generic-advanced-nuclear]
      compare_mode: equal-site
      site_names: [Grohnde, Brokdorf, Isar]
      total_cap_mw: 4500

