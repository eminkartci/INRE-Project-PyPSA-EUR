# INRE V4 scenario overrides (do not overwrite V3 scenario keys).
# 28-day simulation window: 7-day pre-buffer + 14-day core + 7-day post-buffer.
# Snapshots and Atlite cutouts must cover simulation_start … simulation_end
# from data/inre/dunkelflaute.historical.metadata.v4.yaml after event selection.

matched-reference-v4:
  run:
    name: inre-de-matched-reference-v4
  snapshots:
    start: "2021-01-18"
    end: "2021-02-15"
  atlite:
    cutouts:
      europe-2021-sarah3-era5:
        time: ["2021-01-18", "2021-02-15"]
  inre:
    enabled: true
    dunkelflaute:
      enabled: true
      type: matched_reference
      config: data/inre/dunkelflaute.matched-reference.v4.yaml
    nuclear:
      extendable_carriers: []

matched-reference-historical-normal-v4:
  run:
    name: inre-de-matched-ref-histnorm-v4
  snapshots:
