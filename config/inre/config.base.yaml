#
# Germany electricity-only INRE base case (Phase 3: fixed-capacity operational stress test).
# Default snapshots remain 2021 legacy window; historical-severe scenarios override via scenarios.yaml.

tutorial: false

run:
  name: "inre-de-base"
  disable_progressbar: true
  shared_resources:
    policy: false

scenario:
  clusters:
  - 10
  opts:
  - ""

countries:
- DE

snapshots:
  start: "2021-01-25"
  end: "2021-02-08"

costs:
  year: 2050
  custom_cost_fn: data/inre/custom_costs_nuclear.csv

electricity:
  co2limit_enable: true
  co2limit: 50.e+6

  transmission_limit: v0

  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    year: 2024
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

  powerplants_filter: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"

atlite:
  default_cutout: europe-2021-sarah3-era5
  cutouts:
    europe-2021-sarah3-era5:
      time: ["2021-01-25", "2021-02-08"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  exclude_carriers: [OCGT, offwind-ac, coal]
  temporal:
    resolution_elec: 3h

lines:
  dynamic_line_rating:
    activate: false
    max_line_rating: 1.3

solving:
  solver:
    name: highs
    options: highs-default
  check_objective:
    enable: false
  options:
    load_shedding:
      enable: true
      default_cost: 100000
      all_carriers: true

inre:
  enabled: true
  freeze_transmission: true
  patch_co2_emissions: true
  dunkelflaute:
    enabled: false
    type: legacy
    config: data/inre/dunkelflaute.yaml
  nuclear:
    extendable_carriers: []
    sites_file: data/inre/custom_powerplants_nuclear_DE.csv
    p_nom_max_per_site: 1500
    p_min_pu: 0.0
    ramp_limit_per_hour: 0.5
    compare_mode: equal-site
    site_names: [Grohnde, Brokdorf, Isar]
    total_cap_mw: 4500
