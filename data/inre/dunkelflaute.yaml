# INRE Dunkelflaute stress parameters (Phase 2: Jan 2021 winter window).
# Applied by scripts/inre/apply_dunkelflaute.py before solve.

enabled: true
carriers:
  wind: [onwind, offwind-ac, offwind-dc, offwind-float]
  solar: [solar, solar-hsat]

# Used when auto_worst_days is null — full INRE simulation window (14 days, 112 × 3h snapshots).
# Align with config/inre/config.base.yaml snapshots and the notebook stress window.
time_start: "2021-01-25"
time_end: "2021-02-07"

# null = apply profile over the fixed time_start…time_end window (same 14-day stress as GAMSPy).
# Set to an integer (e.g. 5) to stress only the N worst VRE days instead.
auto_worst_days: null

# Scalar derating (fallback when profile is disabled)
# wind_factor: 0.15
# solar_factor: 0.10

# Per-snapshot derating profiles (CSV: columns timestamp, factor in [0, 1])
wind_factor_profile: profiles/dunkelflaute_wind_factors.csv
solar_factor_profile: profiles/dunkelflaute_solar_factors.csv

ramp_hours: 6
